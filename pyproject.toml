[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mychatarchive"
version = "0.4.0"
description = "Local-first AI memory archive. Import chat history, generate semantic embeddings, and search via MCP."
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Channing Chasko", email = "channing@mychatarchive.com"},
]
keywords = ["ai", "chat", "archive", "mcp", "embeddings", "semantic-search", "llm", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core stays lightweight so `uvx mychatarchive` and `pip install mychatarchive`
# are fast: import + full-text search + MCP work with no ML stack. Local
# semantic embeddings (torch + sentence-transformers, ~2GB) move to the
# [local] extra; hosted embeddings use the [openai] extra.
dependencies = [
    "sqlite-vec>=0.1.1",
    # Floor is 1.10.0, not a round number: FastMCP (mcp.server.fastmcp) only
    # exists from 1.2.0 onward, and src/mychatarchive/mcp/server.py also sets
    # mcp.settings.transport_security.enable_dns_rebinding_protection, which
    # requires the TransportSecuritySettings support added in 1.10.0 (that's
    # the binding constraint -- an installed 1.2.x-1.9.x satisfies FastMCP
    # but AttributeErrors on transport_security). A resolver that keeps an
    # already-installed pre-1.10 mcp otherwise satisfies a looser floor and
    # dies at runtime instead of at install time.
    "mcp[cli]>=1.10.0",
    "tqdm>=4.66.0",
    "ijson>=3.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]
openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
mychatarchive = "mychatarchive.cli:main"

[project.urls]
Homepage = "https://mychatarchive.com"
Repository = "https://github.com/1ch1n/mychatarchive"
Issues = "https://github.com/1ch1n/mychatarchive/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
